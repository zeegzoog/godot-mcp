name: Bug report
description: Something does not work as documented or as it did before.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. An AI assistant triages new issues on behalf of the maintainers and says so in its replies; a maintainer can always step in.
        **Security vulnerabilities:** do not report them here. Follow the security policy (SECURITY.md) to report them privately.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version you use, exactly as the product reports it.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and platform
      placeholder: e.g. Windows 11 x64, Ubuntu 24.04, macOS 15 on Apple silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error messages, output, screenshots.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Leave out tokens, passwords and private paths.
      render: text
