name: Feature request
description: Propose new behaviour or an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. An AI assistant triages new issues on behalf of the maintainers and says so in its replies; the maintainers decide which features the project takes on.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The behaviour you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Versions or platforms it concerns, links, examples.
