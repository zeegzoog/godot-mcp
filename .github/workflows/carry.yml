name: Carry

# Carries what lands on master to the release lines: one pull request per line, made with
# `git cherry-pick -x` by .github/scripts/carry.sh. It starts only on a push to master, which only
# a maintainer or a merged pull request makes, and by hand. A pull request never starts it, so
# nothing an outsider writes reaches it. The repository token pushes no workflow of its own, so
# the script starts CI on the branches it pushes.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      commits:
        description: "A master commit id, or from..to"
        required: true

permissions:
  contents: write # pushes the carry branches
  pull-requests: write # opens the pull requests
  issues: write # reports a conflict the script cannot settle
  actions: write # starts CI on a pushed branch

concurrency:
  group: carry
  cancel-in-progress: false

jobs:
  carry:
    name: Carry to the release lines
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Carry the commits of this push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT: ${{ inputs.commits }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            range="$INPUT"
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi
          bash .github/scripts/carry.sh "$range"
