name: CI

on:
  push:
    branches: [master, "godot-v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  godot:
    name: Godot addon (headless editor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Each release line is tested against its own Godot build, named in .github/godot-version.
      - name: Install the line's Godot build
        run: |
          build=$(tr -d '[:space:]' < .github/godot-version)
          echo "Godot $build"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${build}/Godot_v${build}_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${build}_linux.x86_64"
          echo "GODOT_PATH=$RUNNER_TEMP/godot/Godot_v${build}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import the addon dev project
        run: $GODOT_PATH --headless --path . --import

      - name: GDScript syntax check
        run: |
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/plugin.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/bridge_server.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/export_plugin.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/editor/game_relay.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/editor/script_ops.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/core/runtime_override.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/runtime/mcp_runtime.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/runtime/ops/rt_hold.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/runtime/ops/rt_input.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/runtime/ops/rt_live.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/runtime/ops/rt_output.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/runtime/ops/rt_result.gd
          $GODOT_PATH --headless --check-only --path . --script addons/godot_mcp/runtime/ops/rt_view.gd

      - name: End-to-end tests against a real editor
        run: cargo test --test editor_e2e_test -- --ignored --test-threads=2

      - name: The addon stays out of exported games
        run: cargo test --test addon_export_test -- --ignored

      - name: Running game
        run: cargo test --test runtime_e2e_test -- --ignored --test-threads=1
