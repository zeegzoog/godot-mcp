name: Release

on:
  push:
    tags:
      # One release per Godot release line: vX.Y.Z+godot.M.N, tagged on branch godot-vM.N.
      # No "+": GitHub reads it as a quantifier. release-line.sh checks the exact form.
      - "v*.*.*godot.*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-24.04
    outputs:
      suffix: ${{ steps.line.outputs.suffix }}
      title: ${{ steps.line.outputs.title }}
      latest: ${{ steps.line.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The line checks need every branch and tag.
          fetch-depth: 0

      - name: Tag matches the crate version and belongs to a release line
        id: line
        # An explicit bash shell runs with -o pipefail, so a failed check is not hidden by tee.
        shell: bash
        run: bash .github/scripts/release-line.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: CHANGELOG.md has notes for this release
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format, lint and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets

  addon:
    name: Package Godot addon
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package addon archive
        run: zip -r "godot-mcp-addon${{ needs.verify.outputs.suffix }}.zip" addons/godot_mcp

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.verify.outputs.title }}
          make_latest: ${{ needs.verify.outputs.latest }}
          files: godot-mcp-addon${{ needs.verify.outputs.suffix }}.zip
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: godot-mcp.exe
            archive_ext: zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: godot-mcp
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: godot-mcp
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: godot-mcp
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "${{ github.workspace }}/godot-mcp-${{ matrix.target }}${{ needs.verify.outputs.suffix }}.tar.gz" ${{ matrix.bin }}

      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath "godot-mcp-${{ matrix.target }}${{ needs.verify.outputs.suffix }}.zip"

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.verify.outputs.title }}
          make_latest: ${{ needs.verify.outputs.latest }}
          files: godot-mcp-${{ matrix.target }}${{ needs.verify.outputs.suffix }}.*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
