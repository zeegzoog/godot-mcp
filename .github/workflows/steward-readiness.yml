name: Repo steward release readiness

# Keeps one issue labelled release-readiness current: whether the unreleased changes call for a
# release, which version, and what each release target would contain. It never tags or publishes.

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-steward-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and every release target's branch are needed.
          fetch-depth: 0

      - name: Update the readiness notice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .agents/skills/repo-steward/scripts/readiness.sh --default-branch "$DEFAULT_BRANCH" --publish
