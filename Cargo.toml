[package]
name = "godot-mcp"
version = "0.11.1-dev+godot.4.8"
edition = "2024"
rust-version = "1.85"
authors = ["Oleg Alexandrov <alexandrovoleg.ru@gmail.com>"]
description = "High-performance Model Context Protocol (MCP) server for the Godot Game Engine"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zeegzoog/godot-mcp"

[dependencies]
same-file = "1.0.6"
tokio = { version = "1.54.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
uuid = { version = "1.29.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
